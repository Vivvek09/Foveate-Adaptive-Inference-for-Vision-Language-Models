[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foveate"
version = "0.1.0"
description = "Foveate: Adaptive Inference for Vision-Language Models. An open-source framework for profiling, benchmarking, and adaptive inference of vision-language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vivek Gangwani" }]
keywords = ["vlm", "inference", "vllm", "video-qa", "profiling", "cascade"]
# Core deps are CPU-only so tests, replay and reports run anywhere.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pillow>=10",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Video decoding + dataset download.
data = ["av>=12", "huggingface_hub>=0.24", "gdown>=5"]
# Stage-level profiler (Transformers backend).
hf = ["torch>=2.4", "transformers>=4.51", "accelerate>=0.33"]
# Serving gateway and load generator (talks to `vllm serve`).
serve = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# vLLM is installed separately on the GPU box by scripts/setup_gpu.sh (see
# requirements-gpu.txt), because it pins its own torch build.
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/Vivvek09/Foveate-Adaptive-Inference-for-Vision-Language-Models"

[project.scripts]
foveate = "foveate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foveate = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "B905", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["foveate"]
known-local-folder = ["fake_backend", "tiny_qwen"]  # FastAPI Body(...) defaults; long strings in notebook cells
